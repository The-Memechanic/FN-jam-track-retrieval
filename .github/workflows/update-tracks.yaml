name: Update Jam Tracks Data

on:
  schedule:
    # Runs every 6 hours starting at 10:00 AM UTC
    - cron: "0 10,16,22,4 * * *"

  # Allows manual runs from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-tracks:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update tracks
        run: npm run update-tracks

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/tracks.json

          git diff --cached --quiet || git commit -m "Update jam tracks data"

      - name: Push changes
        run: git push